<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>블록 드래곤 헌터</title>
<style>
:root{--panel:rgba(255,255,255,.85);--fg:#1d2a1d;--btn:#2f7d32;--btnfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--panel:rgba(20,26,20,.82);--fg:#f1f6f1;--btn:#43a047;--btnfg:#fff}}
:root[data-theme="dark"]{--panel:rgba(20,26,20,.82);--fg:#f1f6f1;--btn:#43a047;--btnfg:#fff}
html,body{margin:0;height:100%;overflow:hidden;background:#9bd3f0;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--fg);touch-action:none;user-select:none}
#c{position:fixed;inset:0}
.p{position:fixed;background:var(--panel);border-radius:12px;padding:8px 12px;font-size:15px;backdrop-filter:blur(4px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
#hud{top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;max-width:calc(100vw - 170px);z-index:4}
#team{top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;min-width:130px;font-size:14px;z-index:4}
#team div{margin:2px 0}
.hpbar{display:inline-block;width:70px;height:8px;background:rgba(0,0,0,.25);border-radius:4px;overflow:hidden;vertical-align:middle;margin-left:6px}
.hpbar b{display:block;height:100%;width:100%;background:#4cd964}
.mb i.xp{height:4px;margin-top:2px}
.mb i.xp b{background:#4aa8ff}
#mobbars{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.mb{position:absolute;transform:translate(-50%,-100%);font-size:11px;line-height:1.1;text-align:center;color:#fff;text-shadow:0 1px 2px #000,0 0 4px #000;white-space:nowrap}
.mb i{display:block;width:46px;height:6px;margin:2px auto 0;background:rgba(0,0,0,.55);border-radius:3px;overflow:hidden}
.mb i b{display:block;height:100%;width:100%;background:#4cd964}
.dp{position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:17px;color:#ffeb3b;text-shadow:0 1px 3px #000,0 0 6px #000;white-space:nowrap}
#legend{position:fixed;left:0;right:0;top:24%;text-align:center;pointer-events:none;z-index:20;display:none}
#legend .t{font-size:clamp(24px,6.5vw,58px);font-weight:900;letter-spacing:.04em;color:#ffd24a;text-shadow:0 0 12px #ff9a00,0 0 30px #ff5a00,0 3px 0 #7a3b00}
#legend .t span{display:inline-block;opacity:0;transform:translateY(34px) scale(.4);animation:lg .55s cubic-bezier(.2,1.5,.4,1) forwards}
#legend .s{font-size:clamp(15px,3.2vw,24px);color:#fff;text-shadow:0 0 8px #000,0 0 18px #000;margin-top:10px;opacity:0;animation:lgs .6s 1s forwards}
@keyframes lg{to{opacity:1;transform:none}}
@keyframes lgs{to{opacity:1}}
@keyframes lgout{to{opacity:0;transform:scale(1.15)}}
#zone{top:calc(env(safe-area-inset-top,0px) + 56px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:14px;z-index:4}
#msg{top:104px;left:50%;transform:translateX(-50%);max-width:85%;text-align:center;opacity:0;transition:opacity .25s;z-index:15;pointer-events:none}
#bar{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:50%;transform:translateX(-50%);display:flex;gap:4px;flex-wrap:nowrap;justify-content:center;align-items:center;padding:7px 8px;width:fit-content;max-width:calc(100vw - 280px);overflow-x:auto;scrollbar-width:none;z-index:5}
#bar::-webkit-scrollbar{display:none}
#bar button{padding:11px 8px;min-height:42px;font-size:12.5px;font-weight:600;border-radius:9px;white-space:nowrap}
.plbl{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.6);color:#fff;white-space:nowrap;text-shadow:0 1px 2px #000}
button{font:inherit;font-size:14px;background:var(--btn);color:var(--btnfg);border:0;border-radius:10px;padding:8px 11px;cursor:pointer}
button:active{filter:brightness(.85)}
input,select{font:inherit;font-size:14px;padding:7px 10px;border-radius:8px;border:1px solid rgba(128,128,128,.45);background:rgba(255,255,255,.9);color:#111;box-sizing:border-box}
#joyBase{position:fixed;left:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);width:112px;height:112px;border-radius:50%;background:rgba(20,30,20,.26);border:2px solid rgba(255,255,255,.45);backdrop-filter:blur(3px);z-index:6;touch-action:none;box-shadow:0 4px 14px rgba(0,0,0,.22)}
#joyKnob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.85);border:2px solid rgba(47,125,50,.85);box-shadow:0 2px 8px rgba(0,0,0,.3);pointer-events:none;transition:transform .04s linear}
.guide-sec{margin:8px 0;padding:8px 10px;border-radius:9px;background:rgba(128,128,128,.14);font-size:13px;line-height:1.55}
.guide-sec b.hd{display:block;font-size:14px;margin-bottom:4px;color:#eab308}
.kbd{display:inline-block;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.65);color:#fff;font-weight:700;font-size:12px}
</style>
</head>
<body>
<div id="c"></div>
<div id="hud" class="p">
  <span>❤ <b id="hp">10</b>/<b id="mhp">10</b><i class="hpbar"><b id="hpb"></b></i></span>
  <span>Lv.<b id="lv">1</b> <small id="xpt">0/20</small></span>
  <span>🪙 <b id="coin">0</b></span>
  <span>처치 <b id="kill">0</b></span>
  <span>⚔ 공격력 <b id="atkp">1.5</b></span>
  <span id="safe">🛡 안전지대</span>
  <button id="lvMsgBtn" style="padding:2px 6px;font-size:11px;border-radius:6px;background:#2563eb;line-height:1.2">🔔 알림 ON</button>
</div>
<div id="team" class="p"><b>드래곤</b><div>없음</div></div>
<div id="accbar" class="p" style="left:10px;top:calc(env(safe-area-inset-top,0px) + 96px);font-size:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;z-index:5">
  <span id="accLbl">👤 게스트</span>
  <button id="mpStat" style="padding:2px 7px;border-radius:6px;background:rgba(47,125,50,.28);color:inherit;font-size:12px;font-weight:700">🌐 1명 접속 (목록)</button>
  <button id="accBtn" style="padding:4px 8px;font-size:12px">계정 연결</button>
  <button id="admBtn" style="display:none;padding:4px 8px;font-size:12px;background:#d97706">👑 관리자 패널</button>
</div>
<div id="mpp" class="p" style="display:none;left:10px;top:calc(env(safe-area-inset-top,0px) + 136px);min-width:250px;max-width:88vw;font-size:13px;z-index:8"></div>
<div id="zone" class="p"></div>
<div id="dpsBox" class="p" style="display:none;right:10px;top:calc(env(safe-area-inset-top,0px) + 118px);font-size:12px;min-width:155px;z-index:4;border:1px solid rgba(234,179,8,.5)">
  <b>🎯 왕실 훈련장 DPS</b>
  <div>초당 피해: <b id="dpsVal" style="color:#eab308">0</b></div>
  <div>누적 피해: <b id="dpsTot">0</b> (<span id="dpsHit">0</span>타)</div>
  <button id="dpsRst" style="margin-top:4px;padding:2px 7px;font-size:11px;background:#475569">초기화 (H)</button>
</div>
<button id="rideb" style="display:none;position:fixed;right:12px;top:45%;z-index:5;padding:11px 13px">🐉 타기 (R)</button>
<div id="msg" class="p"></div>
<div id="accp" class="p" style="display:none;top:50%;left:50%;transform:translate(-50%,-50%);min-width:300px;max-width:92vw;z-index:12;text-align:left"></div>
<div id="admp" class="p" style="display:none;top:50%;left:50%;transform:translate(-50%,-50%);min-width:310px;max-width:94vw;max-height:84vh;overflow:auto;z-index:12;text-align:left"></div>
<div id="penp" class="p" style="display:none;top:50%;left:50%;transform:translate(-50%,-50%);min-width:320px;max-width:94vw;max-height:82vh;overflow:auto;text-align:left;z-index:10"></div>
<div id="forgep" class="p" style="display:none;top:50%;left:50%;transform:translate(-50%,-50%);min-width:330px;max-width:94vw;max-height:82vh;overflow:auto;text-align:left;z-index:10"></div>
<div id="guidep" class="p" style="display:none;top:50%;left:50%;transform:translate(-50%,-50%);width:430px;max-width:94vw;max-height:84vh;overflow:auto;text-align:left;z-index:11"></div>
<div id="wildp" class="p" style="display:none;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);transform:translateX(-50%);text-align:center;min-width:260px;max-width:92vw;z-index:6"></div>
<div id="mobbars"></div>
<div id="legend"></div>
<button id="ctxb" style="display:none;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);transform:translateX(-50%);z-index:6;padding:10px 14px">열기</button>
<div id="shop" class="p" style="display:none;top:50%;left:50%;transform:translate(-50%,-50%);min-width:310px;max-width:92vw;max-height:80vh;overflow:auto;text-align:left;z-index:10"><b>🛒 장비 상인</b><div id="shopList"></div><button id="shopX" style="margin-top:8px">닫기</button></div>
<div id="joyBase"><div id="joyKnob"></div></div>
<div id="bar" class="p">
  <button id="tame">🤝 길들이기(E)</button>
  <button id="ultb" style="background:#7c3aed">⚡ 필살기(X)</button>
  <button id="guideb" style="background:#0284c7">📜 안내(N)</button>
  <button id="shopb">🛒 상점(F)</button>
  <button id="penb">🐉 울타리(G)</button>
  <button id="forgeb" style="background:#b45309">🔥 진화소(Y)</button>
  <button id="atk">⚔ 공격</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x9bd3f0,1);
$('c').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bd3f0);scene.fog=new THREE.Fog(0x9bd3f0,90,230);
const cam=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.2,450);
scene.add(new THREE.HemisphereLight(0xffffff,0x557755,.95));
const sun=new THREE.DirectionalLight(0xffffff,.6);sun.position.set(20,40,10);scene.add(sun);

// 바이옴 및 지형 (10개 바이옴)
const BIO={
 meadow:{n:'초원',st:1,l:'쉬움',c:[108,195,108],egg:0xfff3d6},
 forest:{n:'숲',st:2,l:'보통',c:[48,120,70],egg:0xd6f0d0},
 desert:{n:'사막',st:3,l:'어려움',c:[222,196,120],egg:0xffe2a8},
 snow:{n:'설원',st:3,l:'어려움',c:[232,242,250],egg:0x4aa8ff},
 lava:{n:'화산',st:4,l:'매우 어려움',c:[84,60,58],egg:0xff3030},
 nest:{n:'용의 둥지',st:5,l:'지옥',c:[62,42,74],egg:0xd0b0ff},
 jungle:{n:'정글',st:3,l:'어려움',c:[34,139,58],egg:0xb8f0a0},
 sanctum:{n:'전설의 드래곤 지역',st:5,l:'전설급',c:[240,222,150],egg:0xffe27a},
 mushroom:{n:'신비한 버섯 지형',st:4,l:'신비급',c:[148,88,185],egg:0xff9ef5},
 crystal:{n:'수정 동굴 지대',st:4,l:'수정급',c:[72,188,214],egg:0x67e8f9}
};
const SEC=['lava','sanctum','forest','jungle','mushroom','desert','crystal','snow','mushroom'];
function biomeAt(x,z){
 const a=Math.atan2(z,x),d=Math.hypot(x,z)+Math.sin(a*6)*17;
 if(d>=392)return'nest';
 if(d<145)return'meadow';
 const idx=Math.floor(((a+Math.PI)/(Math.PI*2))*SEC.length);
 return SEC[Math.max(0,Math.min(SEC.length-1,idx))];
}
const GS=800,GP=1000;
const gc=document.createElement('canvas');gc.width=gc.height=GP;const gx=gc.getContext('2d'),gi=gx.createImageData(GP,GP);
for(let py=0;py<GP;py++)for(let px=0;px<GP;px++){
 const c=BIO[biomeAt((px/GP-.5)*GS,(py/GP-.5)*GS)].c,n=(((px*73856093)^(py*19349663))>>>0)%7*2-6,i=(py*GP+px)*4;
 gi.data[i]=c[0]+n;gi.data[i+1]=c[1]+n;gi.data[i+2]=c[2]+n;gi.data[i+3]=255;
}
gx.putImageData(gi,0,0);const gt=new THREE.CanvasTexture(gc);gt.magFilter=THREE.NearestFilter;
const farG=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshLambertMaterial({color:0x3e6b3e}));farG.rotation.x=-Math.PI/2;farG.position.y=-.35;scene.add(farG);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(GS,GS),new THREE.MeshLambertMaterial({map:gt}));
ground.rotation.x=-Math.PI/2;ground.position.y=0;scene.add(ground);

const box=(w,h,d,c,x=0,y=0,z=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:c}));m.position.set(x,y,z);return m};
const R=(a,b)=>a+Math.random()*(b-a);
const BOUND=400;

// 확장된 안전지대 성벽 (반경 64, 동·서·남·북 4대 성문 + 성벽 위 발리스타)
const SZ=64,WALL_H=9,WALL_W=4.2,GATEW=5.2/SZ;
const angDiff=(a,b)=>Math.abs(((a-b+Math.PI*3)%(Math.PI*2))-Math.PI);
const GATES=[
 {id:'N',name:'북문',ang:-Math.PI/2,x:0,z:-SZ,rot:0,open:true,door:null},
 {id:'E',name:'동문',ang:0,x:SZ,z:0,rot:-Math.PI/2,open:true,door:null},
 {id:'S',name:'남문',ang:Math.PI/2,x:0,z:SZ,rot:Math.PI,open:true,door:null},
 {id:'W',name:'서문',ang:Math.PI,x:-SZ,z:0,rot:Math.PI/2,open:true,door:null}
];
function gateAtAngle(a){
 for(const gt of GATES){if(angDiff(a,gt.ang)<GATEW)return gt}
 return null;
}
function nearAnyGate(){
 let best=null,bd=8.0;
 for(const gt of GATES){
  const d=Math.hypot(P.position.x-gt.x,P.position.z-gt.z);
  if(d<bd){bd=d;best=gt}
 }
 return best;
}
function toggleCastleGate(gt){
 const target=gt||nearAnyGate();
 if(!target)return;
 target.open=!target.open;
 if(window.sendWsGate)window.sendWsGate(target.id,target.open);
 toast(target.open?`🚪 ${target.name} 성문을 열었습니다!`:`🔒 ${target.name} 성문을 닫았습니다!`);
}
function setAllGates(openState){
 GATES.forEach(g=>g.open=openState);
 if(window.sendWsGate)window.sendWsGate('ALL',openState);
 toast(openState?'🚪 동·서·남·북 4대 성문을 모두 열었습니다!':'🔒 동·서·남·북 4대 성문을 모두 닫았습니다!');
}

// 지형 오브젝트
function prop(x,z,b){
 const g=new THREE.Group(),r=Math.random();
 if(b==='jungle'){const h=6+r*5;g.add(box(1.2,h,1.2,0x6b4a2a,0,h/2,0));g.add(box(4.5,1.2,4.5,0x1fae3a,0,h+.6,0));g.add(box(3,1.2,3,0x2ad04a,0,h+1.7,0));if(r<.3)g.add(box(.5,.5,.5,0xff5a8a,1.5,h,1.5))}
 else if(b==='sanctum'){
  if(r<.55){const h=5+r*6;g.add(box(1.3,h,1.3,0xf5e6a8,0,h/2,0));g.add(box(2,.5,2,0xffd24a,0,h+.25,0));g.add(box(2,.5,2,0xffd24a,0,.25,0))}
  else{const c=box(1.1,2.6+r*3,1.1,r<.8?0x9ff0ff:0xff9ae6,0,1.5+r,0);c.material.emissive.setHex(r<.8?0x2a9ab0:0xb0309a);g.add(c);g.add(box(2.2,.4,2.2,0xf5e6a8,0,.2,0))}
 }
 else if(b==='mushroom'){
  const h=3.2+r*4.2,capC=r<.5?0xe03a7a:0x8b3ad8;
  g.add(box(.9,h,.9,0xf3e8ff,0,h/2,0));
  g.add(box(3.8,1.1,3.8,capC,0,h+.4,0));
  g.add(box(2.4,.7,2.4,capC,0,h+1.1,0));
  g.add(box(.5,.5,.5,0xffffff,1.2,h+.8,1.1));
  g.add(box(.5,.5,.5,0xffffff,-1.1,h+.8,-1.2));
  const glow=box(.6,.6,.6,0xff9ef5,1.1,.3,.9);glow.material.emissive.setHex(0x9a2090);g.add(glow);
 }
 else if(b==='crystal'){
  const h=3.4+r*4.5;
  const mainC=box(1.1,h,1.1,0x38bdf8,0,h/2,0);mainC.material.emissive.setHex(0x0284c7);g.add(mainC);
  const side1=box(.75,h*.65,.75,0xa855f7,.85,h*.32,.3);side1.rotation.z=-.25;side1.material.emissive.setHex(0x6b21a8);g.add(side1);
  const side2=box(.7,h*.55,.7,0x67e8f9,-.8,h*.28,-.35);side2.rotation.z=.28;side2.material.emissive.setHex(0x0891b2);g.add(side2);
  g.add(box(2.6,.35,2.6,0x1e293b,0,.18,0));
 }
 else if(b==='meadow'){g.add(box(.9,3,.9,0x7a5230,0,1.5,0));g.add(box(3,2.6,3,0x2e8b3a,0,4,0));g.add(box(1.8,1.6,1.8,0x39a047,0,5.7,0))}
 else if(b==='forest'){const h=4+r*3;g.add(box(1.1,h,1.1,0x5a3a20,0,h/2,0));g.add(box(3.6,3,3.6,0x1f6b32,0,h+.8,0));g.add(box(2.2,2,2.2,0x27803c,0,h+2.8,0))}
 else if(b==='desert'){if(r<.6){g.add(box(.9,3.2,.9,0x3f9a4a,0,1.6,0));g.add(box(.5,1.2,.5,0x3f9a4a,.8,2.2,0));g.add(box(.5,.5,.5,0x3f9a4a,.55,1.6,0))}else g.add(box(2+r,1.4,2,0xb89a64,0,.7,0))}
 else if(b==='snow'){if(r<.7){g.add(box(.9,2.5,.9,0x5a3a20,0,1.25,0));g.add(box(3,2,3,0x2f6b4a,0,3.5,0));g.add(box(2,.8,2,0xffffff,0,4.9,0))}else g.add(box(2,2.6,2,0xaee6ff,0,1.3,0))}
 else if(b==='lava'){if(r<.55)g.add(box(2.4,2.2+r*2,2.4,0x2a2220,0,1.4,0));else{const l=box(4.5,.12,4.5,0xff5a1a,0,.1,0);l.material.emissive.setHex(0xff3300);g.add(l)}}
 else{g.add(box(.6,3+r*3,.6,0xe8e0d0,0,2,0));g.add(box(2,1.2,2,0x2a1a30,0,.6,0))}
 g.position.set(x,0,z);g.rotation.y=R(0,6.28);scene.add(g);
}
for(let i=0;i<1150;i++){const x=R(-BOUND,BOUND),z=R(-BOUND,BOUND);if(Math.hypot(x,z)<SZ+8)continue;prop(x,z,biomeAt(x,z))}

function label(txt,y){const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.55)';x.fillRect(0,0,256,64);x.fillStyle='#fff';x.font='bold 32px sans-serif';x.textAlign='center';x.fillText(txt,128,44);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(5,1.25,1);s.position.y=y;return s}

const STAIR_X=13.5,STAIR_Z0=-44.0,STAIR_Z1=-(SZ-1.4);

const EVO_EL_BY_RANK=['번개','불','용암','고대의','전설의'];
function evolveDragons(fromRank){
 const toRank=fromRank+1;
 if(toRank>5)return toast('관리자 전용 드래곤은 진화로 만들 수 없습니다!');
 const pool=[];
 team.forEach((d,i)=>{if(RAR.indexOf(d.r)===fromRank)pool.push({src:'team',idx:i,d})});
 pen.forEach((d,i)=>{if(RAR.indexOf(d.r)===fromRank)pool.push({src:'pen',idx:i,d})});
 if(pool.length<3)return toast('같은 등급 드래곤이 3마리 필요해요!');
 pool.sort((a,b)=>(a.d.fav?1:0)-(b.d.fav?1:0));
 const picked=pool.slice(0,3);
 const teamDel=picked.filter(p=>p.src==='team').map(p=>p.idx).sort((a,b)=>b-a);
 const penDel=picked.filter(p=>p.src==='pen').map(p=>p.idx).sort((a,b)=>b-a);
 teamDel.forEach(i=>{const d=team[i];if(riding===d)dismount();scene.remove(d.g);team.splice(i,1)});
 penDel.forEach(i=>{const d=pen[i];scene.remove(d.g);pen.splice(i,1)});

 const nr=RAR[toRank];
 const nel=toRank===5?'고대의':toRank===4?'전설의':(picked[0].d.el&&EL[picked[0].d.el]?picked[0].d.el:EVO_EL_BY_RANK[Math.min(toRank,EVO_EL_BY_RANK.length-1)]);
 const nd={r:nr,el:nel,g:eliteGlow(makeDragon(EL[nel],nr.s*(ELT[nel]?1.3:1),nel),nel),cd:0,ph:R(0,6),fav:true};
 scene.add(nd.g);
 if(team.length<3){team.push(nd);nd.g.position.set(P.position.x+2,P.position.y+2,P.position.z+2)}
 else penAdd(nd);
 if(toRank===5)legendBanner('🌌 고대 드래곤 진화 성공! 🌌',dname(nd)+' 탄생!');
 else if(toRank===4)legendBanner('🌈 전설의 드래곤 진화 성공! 🌈',dname(nd)+' 탄생!');
 else toast(`✨ 진화 성공! ${dname(nd)} 획득!`);
 ui();renderForge();
}

 }
 if(!anyAvail)h+='<div style="margin-top:8px;font-size:12px;color:#eab308">💡 알을 부화시켜 같은 등급 드래곤 3마리를 모아보세요!</div>';

function updateWallGuards(dt,t){
 if(!wallGuards.length)return;
 wallGuards.forEach(w=>{
  w.spawnT=(w.spawnT??1)+dt*1.6;
  const p=Math.min(1,w.spawnT);
  const ease=1-Math.pow(1-p,3);
  w.g.scale.setScalar(.2+.8*ease);
  if(w.beam){
   w.beam.material.opacity=Math.max(0,(1-p)*.7);
   w.beam.rotation.y+=dt*5;
   if(p>=1){w.g.remove(w.beam);w.beam=null}
  }

  w.ang+=dt*.10;
  if(gateAtAngle(w.ang))w.ang+=dt*.25;
  const x=Math.cos(w.ang)*SZ,z=Math.sin(w.ang)*SZ;
  const dropY=(1-ease)*14;
  w.g.position.set(x,WALL_H+dropY+Math.abs(Math.sin(t*7+w.ph))*.08,z);
  w.g.rotation.y=-w.ang;
  w.cd-=dt;
  if(p>=1&&w.cd<=0){
   let best=null,bd=28;
   mobs.forEach(m=>{const d=Math.hypot(m.g.position.x-x,m.g.position.z-z);if(d<bd){bd=d;best=m}});
   if(best){
    w.cd=1.25;
    w.g.rotation.y=Math.atan2(best.g.position.x-x,best.g.position.z-z);
    const s=new THREE.Mesh(new THREE.SphereGeometry(.28,6,6),new THREE.MeshBasicMaterial({color:0xfacc15}));
    const from=new THREE.Vector3(x,WALL_H+2.0,z);s.position.copy(from);
    const dir=best.g.position.clone().add(new THREE.Vector3(0,1,0)).sub(from).normalize();
    scene.add(s);shots.push({m:s,v:dir.multiplyScalar(28),dm:12,el:'빛',life:1.3});
   }
  }
 });
}

function isOnStairArea(x,z){
 return Math.abs(Math.abs(x)-STAIR_X)<=2.05&&z<=STAIR_Z0+.6&&z>=STAIR_Z1-4.5;
}
function stairHeightAt(z){
 if(z<=STAIR_Z1)return WALL_H;
 if(z>=STAIR_Z0)return 0;
 return Math.max(0,Math.min(WALL_H,((STAIR_Z0-z)/(STAIR_Z0-STAIR_Z1))*WALL_H));
}
function surfaceYAt(x,z){
 if(pl.inSecret)return SECRET_POS.y;
 const d=Math.hypot(x,z),ang=Math.atan2(z,x);
 if(gateAtAngle(ang))return 0;
 if(isOnStairArea(x,z))return stairHeightAt(z);
 if(Math.abs(d-SZ)<=2.35)return WALL_H;
 return 0;
}

const joyBase=$('joyBase'),joyKnob=$('joyKnob');let joyPid=null;
function setJoyVisual(nx,nz){joyKnob.style.transform=`translate(${nx*34}px,${nz*34}px)`}
function updateJoyFromEvent(e){
 const rect=joyBase.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
 const dx=e.clientX-cx,dy=e.clientY-cy,dist=Math.hypot(dx,dy),maxR=42,clamped=Math.min(dist,maxR),ang=Math.atan2(dy,dx);
 const nx=dist>4?(Math.cos(ang)*clamped)/maxR:0,nz=dist>4?(Math.sin(ang)*clamped)/maxR:0;
 joy.x=nx;joy.z=nz;setJoyVisual(nx,nz);
}
joyBase.addEventListener('pointerdown',e=>{e.stopPropagation();joyPid=e.pointerId;joyBase.setPointerCapture(e.pointerId);updateJoyFromEvent(e)});
joyBase.addEventListener('pointermove',e=>{if(e.pointerId===joyPid){e.stopPropagation();updateJoyFromEvent(e)}});
const resetJoy=e=>{if(e.pointerId===joyPid){joyPid=null;joy.x=0;joy.z=0;setJoyVisual(0,0)}};
joyBase.addEventListener('pointerup',resetJoy);joyBase.addEventListener('pointercancel',resetJoy);

function calcMax(){pl.max=ARMORS[pl.armor].hp+(pl.lv-1)*3}
function updateLvMsgBtn(){
 const b=$('lvMsgBtn');if(!b)return;
 b.textContent=pl.lvMsg?'🔔 알림 ON':'🔕 알림 OFF';
 b.style.background=pl.lvMsg?'#2563eb':'#6b7280';
}
$('lvMsgBtn').onclick=()=>{
 pl.lvMsg=!pl.lvMsg;
 updateLvMsgBtn();
 if(!pl.lvMsg){
  clearTimeout(lgT);
  const el=$('legend');if(el)el.style.display='none';
  toast('🔕 레벨업 알림을 껐습니다');
 }else{
  toast('🔔 레벨업 알림을 켰습니다');
 }
 if(saveOn)save();
};
function gainXp(n){
 if(pl.lv>=LV_MAX)return;pl.xp+=n;let up=false;
 while(pl.lv<LV_MAX&&pl.xp>=xpNeed(pl.lv)){pl.xp-=xpNeed(pl.lv);pl.lv++;up=true}
 if(pl.lv>=LV_MAX)pl.xp=0;
 if(up){calcMax();pl.hp=pl.max;
  if(pl.lv>=LV_MAX)becomeGod(true);
  else if(pl.lvMsg){
   if(pl.lv<=50||pl.lv%10===0)legendBanner('⬆ LEVEL UP! ⬆','Lv.'+pl.lv+' · 최대 체력 '+pl.max+' (체력 가득 회복)');
   else toast('⬆ Lv.'+pl.lv+' · 최대 체력 '+pl.max);
  }
 }
}
function becomeGod(ann){pl.god=pl.lv>=LV_MAX;gear();if(pl.god&&ann&&pl.lvMsg){legendBanner('👑 드래곤의 신 강림! 👑','레벨 '+LV_MAX+' 달성 · 공격력 x3 · 드래곤 공격 x2 · 이동 x1.3');ui()}}

 mobs.forEach(m=>{
  if(!m.bar){const e=document.createElement('div');e.className='mb';e.innerHTML='<span></span><i><b></b></i>';mbEl.appendChild(e);m.bar=e;m.barS=e.firstChild;m.barB=e.querySelector('b')}

const penEl=$('penp');
function penAdd(d){pen.push(d);d.tx=0;d.g.position.set(PEN.x+R(-PEN.w/2+2,PEN.w/2-2),1,PEN.z+R(-PEN.d/2+2,PEN.d/2-2))}
function nearPen(){return !pl.inSecret&&Math.abs(P.position.x-PEN.x)<PEN.w/2+3&&Math.abs(P.position.z-PEN.z)<PEN.d/2+3}
function togglePen(){
 if(penEl.style.display==='block'){penEl.style.display='none';return}
 if(!nearPen())return toast('울타리에 가까이 가세요 (G)');
 renderPen();penEl.style.display='block';
}
let pending=null;const chEl=$('wildp');
function finishTame(d){wild=null;d.fav=false;if(team.length<3){keepDragon(d,false);return}pending=d;toast(`${dname(d)}을(를) 길들였어요! 팀이 가득 찼어요 - 선택하세요`);renderChoice();ui()}
function keepDragon(d,toPen){
 pending=null;const nm=dname(d);
 if(toPen){penAdd(d);toast(`${nm}을(를) 울타리에 보관했어요 📦`)}
 else{team.push(d);d.g.position.set(P.position.x+2,P.position.y+2,P.position.z+2);toast(`${nm}을(를) 길들였어요! (X키로 필살기 사용 가능!)`)}
 if(d.r===RAR[6]){pl.genSaddle=true;legendBanner('👑 창세의 신룡 강림! 👑',nm+' · 전용 안장 지급!')}
 else if(d.r===RAR[8]){pl.midSaddle=true;legendBanner('👑 황금 천왕룡 강림! 👑',nm+' · 전용 안장 지급!')}
 else if(d.r===RAR[7]){pl.subSaddle=true;legendBanner('🛡 청람 수호룡 강림! 🛡',nm+' · 전용 안장 지급!')}
 else if(d.r===RAR[5])legendBanner('🌌 고대 드래곤 강림! 🌌',nm);
 else if(d.r===RAR[4])legendBanner('🌈 전설의 드래곤 강림! 🌈',nm);
 else if(d.r===RAR[2])legendBanner('✨ 전설 드래곤 획득! ✨',nm);
 else if(d.r===RAR[3])legendBanner('🔮 신화 드래곤 획득! 🔮',nm);
 renderChoice();ui();
}
function releaseDragon(d,msg){scene.remove(d.g);if(wild===d)wild=null;if(pending===d)pending=null;toast(msg||'드래곤을 놓아줬어요 👋');renderChoice();ui()}
function releaseWild(){if(wild)releaseDragon(wild,`야생 ${dname(wild)}을(를) 놓아줬어요 👋`)}
function renderChoice(){
 if(pending){chEl.style.display='block';chEl.innerHTML=`<b>${dname(pending)}</b><div style="margin:4px 0 8px;font-size:13px">팀이 가득 찼어요. 어떻게 할까요?</div><div style="display:flex;gap:8px;justify-content:center">`+(pen.length<PEN_MAX?'<button data-ch="pen">📦 울타리에 보관</button>':'')+'<button data-ch="free">👋 놓아주기 (Q)</button></div>';return}
 if(wild){chEl.style.display='block';chEl.innerHTML=`<b>야생 ${dname(wild)} 등장!</b><div style="margin:4px 0 8px;font-size:13px">길들일지 선택하세요 (길들이기 ${wild.press}/3 · 가까이 가서 E)</div><div style="display:flex;gap:8px;justify-content:center"><button data-ch="tame">🤝 길들이기 (E)</button><button data-ch="free">👋 놓아주기 (Q)</button></div>`;return}
 chEl.style.display='none';
}
chEl.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;t.blur();const a=t.dataset.ch;
 if(a==='tame')tameTry();else if(a==='free'){if(pending)releaseDragon(pending);else releaseWild()}else if(a==='pen'&&pending)keepDragon(pending,true);
});
function renderPen(){
 const star=(d,w,i)=>`<button data-pa="fav" data-w="${w}" data-i="${i}" style="background:transparent;color:inherit;padding:0 8px 0 0;font-size:18px;line-height:1">${d.fav?'★':'☆'}</button>`;
 const row=(d,w,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid rgba(128,128,128,.25)"><span>${star(d,w,i)}<span style="color:${d.r.c}">●</span> ${dname(d)}</span><button data-pa="${w==='t'?'store':'take'}" data-i="${i}" style="padding:4px 10px">${w==='t'?'📦 보관':'🐉 데려가기'}</button></div>`;
 let h=`<b>🐉 드래곤 울타리</b><div style="margin:8px 0 2px;font-weight:600">내 팀 (${team.length}/3)</div>`;
 h+=team.length?team.map((d,i)=>row(d,'t',i)).join(''):'<div style="opacity:.6;padding:4px 0">비어 있어요</div>';
 h+=`<div style="margin:10px 0 2px;font-weight:600">울타리 (${pen.length}/${PEN_MAX})</div>`;
 const idx=pen.map((d,i)=>i).sort((a,b)=>(pen[b].fav?1:0)-(pen[a].fav?1:0)||pen[b].r.k-pen[a].r.k);
 h+=idx.length?idx.map(i=>row(pen[i],'p',i)).join(''):'<div style="opacity:.6;padding:4px 0">보관 중인 드래곤이 없어요</div>';
 h+='<div style="display:flex;gap:8px;margin-top:10px"><button data-pa="arr" style="flex:1">★ 즐겨찾기로 팀 구성</button><button id="penX">닫기</button></div>';
 penEl.innerHTML=h;
}
function arrangeFav(){
 const all=team.concat(pen),f=all.filter(d=>d.fav),o=all.filter(d=>!d.fav);if(!f.length)return toast('먼저 ☆를 눌러 즐겨찾기를 지정하세요');
 const oldT=team.slice(),nt=f.slice(0,3);while(nt.length<3&&o.length)nt.push(o.shift());const np=f.slice(3).concat(o);
 if(riding&&!nt.includes(riding))dismount();
 team.length=0;nt.forEach(d=>{team.push(d);if(!oldT.includes(d))d.g.position.set(P.position.x+2,P.position.y+2,P.position.z+2)});
 pen.length=0;np.forEach(d=>{if(oldT.includes(d))penAdd(d);else pen.push(d)});toast('즐겨찾기 드래곤으로 팀을 구성했어요 ★');
}
penEl.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;t.blur();if(t.id==='penX'){penEl.style.display='none';return}
 const a=t.dataset.pa,i=+t.dataset.i,w=t.dataset.w;
 if(a==='fav'){const d=(w==='t'?team:pen)[i];if(d)d.fav=!d.fav}
 else if(a==='store'){const d=team[i];if(d){if(pen.length>=PEN_MAX)toast('울타리가 가득 찼어요');else{if(riding===d)dismount();team.splice(i,1);penAdd(d);toast(`${dname(d)}을(를) 울타리에 맡겼어요`)}}}
 else if(a==='take'){const d=pen[i];if(d){if(team.length>=3)toast('팀이 가득 찼어요 (먼저 보관하세요)');else{pen.splice(i,1);team.push(d);d.g.position.set(P.position.x+2,P.position.y+2,P.position.z+2);toast(`${dname(d)}이(가) 팀에 합류했어요`)}}}
 else if(a==='arr')arrangeFav();
 ui();renderPen();
});
function penUpdate(dt,t){
 pen.forEach((d,i)=>{
  const p=d.g.position;
  if(!d.tx||Math.hypot(d.tx-p.x,d.tz-p.z)<.5){d.tx=PEN.x+R(-PEN.w/2+2,PEN.w/2-2);d.tz=PEN.z+R(-PEN.d/2+2,PEN.d/2-2)}
  const dx=d.tx-p.x,dz=d.tz-p.z,l=Math.hypot(dx,dz)||1;p.x+=dx/l*1.4*dt;p.z+=dz/l*1.4*dt;d.g.rotation.y=Math.atan2(dx,dz);
  p.y+=(.65*d.g.scale.x+Math.sin(t*3+i)*.06-p.y)*Math.min(1,dt*4);
  d.g.userData.wL.rotation.z=Math.sin(t*3+i)*.15;d.g.userData.wR.rotation.z=-Math.sin(t*3+i)*.15;
  if(d.g.userData.aura)d.g.userData.aura.rotation.y=t*2;
  if(d.g.userData.genWheel){d.g.userData.genWheel.rotation.z=t*1.6;d.g.userData.genOrbs.rotation.y=t*2.2;d.g.userData.genCore.rotation.y=t*3.5;d.g.userData.genCore.rotation.x=t*2.5}
 });
}
function canRideDragon(d){
 if(d.el==='창세의')return !!pl.genSaddle;
 if(d.el==='천왕의')return !!pl.midSaddle;
 if(d.el==='수호의')return !!pl.subSaddle;
 return !!pl.saddle;
}
function dismount(){if(riding){riding.ride=false;riding=null}P.position.y=surfaceYAt(P.position.x,P.position.z);ui()}
function toggleRide(){
 if(mountedBallista)return toast('먼저 발리스타에서 내리세요 (V)');
 if(riding){dismount();toast('드래곤에서 내렸어요');return}
 if(!team.length)return toast('길들인 드래곤이 없어요');
 const rideable=team.filter(canRideDragon);
 if(!rideable.length){
  const hasGen=team.some(d=>d.el==='창세의');
  const hasMid=team.some(d=>d.el==='천왕의');
  const hasSub=team.some(d=>d.el==='수호의');
  return toast(hasGen?'창세의 신룡 전용 안장이 필요해요!':hasMid?'황금 천왕룡 전용 안장이 필요해요!':hasSub?'청람 수호룡 전용 안장이 필요해요!':'안장이 필요해요! 장비 상인에게서 살 수 있어요 (F)');
 }
 let best=null,bd=14;rideable.forEach(d=>{const k=Math.hypot(d.g.position.x-P.position.x,d.g.position.z-P.position.z);if(k<bd){bd=k;best=d}});
 if(!best)return toast('드래곤이 너무 멀어요');
 riding=best;best.ride=true;best.spd=best.r.sp||1.7;
 const rideMsg=best.el==='창세의'?`👑 창세의 신룡 전용 안장으로 탑승! 속도 x${best.spd}`:best.el==='천왕의'?`👑 황금 천왕룡 전용 안장으로 탑승! 속도 x${best.spd}`:best.el==='수호의'?`🛡 청람 수호룡 전용 안장으로 탑승! 속도 x${best.spd}`:`${dname(best)}에 올라탔어요! 속도 x${best.spd}`;
 toast(rideMsg);ui();
}
function rideUpdate(dt,t){
 if(!riding)return;const d=riding,s=d.g.scale.x,baseY=surfaceYAt(P.position.x,P.position.z),h=baseY+1.4*s+.4+Math.sin(t*5)*.15;
 d.g.position.set(P.position.x,h,P.position.z);d.g.rotation.y=pl.face;P.position.y=h+.4*s-.8;
}

 $('lv').textContent=pl.lv+(pl.supGear?' 🔱 총관리자':pl.god?' 👑 드래곤의 신':'');$('xpt').textContent=pl.lv>=LV_MAX?'MAX':pl.xp+'/'+xpNeed(pl.lv);

 $('coin').textContent=pl.coins;$('kill').textContent=pl.kills;

 if(!team.length)h+='<div>없음</div>';
 if(pl.subSaddle)h+='<div style="color:#0284c7;font-size:12px">🛡 수호룡 전용 안장 보유</div>';
 if(pl.midSaddle)h+='<div style="color:#d97706;font-size:12px">👑 천왕룡 전용 안장 보유</div>';
 if(pl.genSaddle)h+='<div style="color:#059669;font-size:12px">👑 신룡 전용 안장 보유</div>';
 if(pen.length)h+='<div>📦 울타리 '+pen.length+'/'+PEN_MAX+'</div>';if(wild)h+='<div>🥚 야생 '+wild.press+'/3</div>';
 $('team').innerHTML=h;

 rb.style.display=(canRide||riding)?'block':'none';
 rb.textContent=riding?'🐉 내리기 (R)':(team.some(d=>d.el==='창세의'&&pl.genSaddle)?'👑 신룡 타기 (R)':team.some(d=>d.el==='천왕의'&&pl.midSaddle)?'👑 천왕룡 타기 (R)':team.some(d=>d.el==='수호의'&&pl.subSaddle)?'🛡 수호룡 타기 (R)':'🐉 타기 (R)');
 if(saveOn)save();
}

function updateUltFx(dt){
 for(let i=ultFxList.length-1;i>=0;i--){
  const fx=ultFxList[i];fx.t+=dt;
  const p=Math.min(1,fx.t/fx.dur);
  if(fx.type==='wave'){
   const sc=1+p*fx.maxR;
   fx.m.scale.set(sc,sc,1);
   fx.m.material.opacity=Math.max(0,(1-p)*0.9);
  }else if(fx.type==='beam'){
   fx.m.rotation.y+=dt*6;
   fx.m.scale.x=fx.m.scale.z=Math.max(0.1,1-p*0.65);
   fx.m.material.opacity=Math.max(0,(1-p)*0.88);
  }else if(fx.type==='meteor'){
   fx.m.rotation.x+=dt*8;fx.m.rotation.y+=dt*6;
   const sy=fx.ty+26;
   fx.m.position.y=sy*(1-p)+fx.ty*p;
   fx.m.position.x+=(fx.tx-fx.m.position.x)*Math.min(1,dt*10);
   fx.m.position.z+=(fx.tz-fx.m.position.z)*Math.min(1,dt*10);
   if(p>=1)spawnShockwave(fx.tx,fx.ty,fx.tz,fx.col,8,0.5);
  }
  if(p>=1){scene.remove(fx.m);ultFxList.splice(i,1)}
 }
}

function updateShots(dt){

  s.hitSet=s.hitSet||new Set();

   if(s.hitSet.has(m))continue;
   const hitY=s.ballista?12.0:3.5;
   if(Math.hypot(m.g.position.x-s.m.position.x,m.g.position.z-s.m.position.z)<(s.ballista?2.2:1.3)+m.r*.5&&Math.abs(s.m.position.y-(m.g.position.y+1.2))<hitY){hit=m;break}

   for(const dm of dummies){
    if(s.hitSet.has(dm))continue;
    if(Math.hypot(dm.g.position.x-s.m.position.x,dm.g.position.z-s.m.position.z)<1.5&&Math.abs(s.m.position.y-(dm.g.position.y+1.5))<3.5){hit=Object.assign(dm,{isDummy:true});break}
   }
  }
  if(hit){
   s.hitSet.add(hit);
   hurt(hit,s.dm*(s.el==='암흑'&&Math.random()<.25?2:1),s.el==='땅'?2.5:0);
   if(!hit.isDummy){
    if(s.el==='얼음')hit.slow=2.5;if(s.el==='독')hit.poi=3;
    if(s.el==='용암'){mobs.slice().forEach(m=>{if(m!==hit&&m.g.position.distanceTo(hit.g.position)<5){hurt(m,s.dm*.6,0);m.poi=4}});hit.poi=4}

    if(s.el==='전설의'){mobs.slice().forEach(m=>{if(m!==hit&&m.g.position.distanceTo(hit.g.position)<6){hurt(m,s.dm*.5,0);m.poi=3}});hit.poi=3}
    if(s.el==='고대의'){mobs.slice().forEach(m=>{if(m.g.position.distanceTo(hit.g.position)<6.5){if(m!==hit)hurt(m,s.dm*.7,0);m.frz=3;m.poi=4}});hit.frz=3;hit.poi=4}
    if(s.el==='수호의'){mobs.slice().forEach(m=>{if(m.g.position.distanceTo(hit.g.position)<7){if(m!==hit)hurt(m,s.dm*.7,0);m.frz=3;m.slow=4}});hit.frz=3;if(pl.hp<pl.max){pl.hp=Math.min(pl.max,pl.hp+1);ui()}}
    if(s.el==='천왕의'){mobs.slice().forEach(m=>{if(m.g.position.distanceTo(hit.g.position)<8){if(m!==hit)hurt(m,s.dm*.8,0);m.frz=3.5;m.poi=4.5}});hit.frz=3.5;hit.poi=4.5;if(pl.hp<pl.max){pl.hp=Math.min(pl.max,pl.hp+1.5);ui()}}
    if(s.el==='창세의'){mobs.slice().forEach(m=>{if(m.g.position.distanceTo(hit.g.position)<9){if(m!==hit)hurt(m,s.dm*.9,0);m.frz=4;m.poi=5}});hit.frz=4;hit.poi=5}
    if(s.el==='바람'){let o=null,od=8;mobs.forEach(m=>{const k=m.g.position.distanceTo(hit.g.position);if(m!==hit&&k<od){od=k;o=m}});if(o)hurt(o,s.dm*.6,0)}
    if(s.el==='빛'&&pl.hp<pl.max){pl.hp=Math.min(pl.max,pl.hp+.5);ui()}
    if(s.el==='불')mobs.slice().forEach(m=>{if(m!==hit&&m.g.position.distanceTo(hit.g.position)<3)hurt(m,1,0)});
   }
   if(!s.pierce){scene.remove(s.m);shots.splice(i,1);continue}
  }

 }
}

<script>
// ============================================================================

(function initWsMultiplayer(){
 const remotes=new Map();
 let ws=null,myId=null,reconnectTimer=null;

 const defaultUrl=(location.protocol==='https:'?'wss://':'ws://')+location.host;
 function getWsUrl(){
  const u=(localStorage.getItem('bdh_ws_url')||'').trim();
  if(u)return u;
  if(location.protocol==='http:'||location.protocol==='https:')return defaultUrl;
  return 'ws://localhost:3000';
 }

 // 원격 플레이어 보간 및 렌더링 루프 연결
 const prevUpdate=window.updateRemotePlayers;
 window.updateRemotePlayers=function(dt,t){
  if(typeof prevUpdate==='function')prevUpdate(dt,t);
  remotes.forEach(r=>{
   r.g.position.x+=(r.tx-r.g.position.x)*Math.min(1,dt*12);
   r.g.position.y+=(r.ty-r.g.position.y)*Math.min(1,dt*12);
   r.g.position.z+=(r.tz-r.g.position.z)*Math.min(1,dt*12);
   r.g.rotation.y=r.face;
   const u=r.g.userData,sw=r.mv?Math.sin(t*12)*.7:0,sit=!!r.riding,hasGun=!!activeGunType(r.sword||0,r.adminGun||'');
   u.lL.rotation.x=sit?-1.25:sw;u.lR.rotation.x=sit?-1.25:-sw;
   u.aL.rotation.x=sit?-.7:-sw*.8;u.aR.rotation.x=hasGun?-1.45:(sit?-.5:sw*.8);
   if(u.supBuilt&&r.supGear){
    u.supHalo.rotation.z=t*1.8;
    u.floatBlades.rotation.z=t*3.2;
    const v=Math.sin(t*5)*.22;u.sWings[0].rotation.y=v;u.sWings[1].rotation.y=-v;
   }
   if(r.drag){
    const a=t*.5,dx=r.g.position.x+Math.cos(a)*3.5,dz=r.g.position.z+Math.sin(a)*3.5;
    r.drag.position.x+=(dx-r.drag.position.x)*Math.min(1,dt*4);
    r.drag.position.z+=(dz-r.drag.position.z)*Math.min(1,dt*4);
    r.drag.position.y=r.g.position.y+2.1+Math.sin(t*3)*.3;
    r.drag.rotation.y=r.face;
    r.drag.userData.wL.rotation.z=Math.sin(t*9)*.5;
    r.drag.userData.wR.rotation.z=-Math.sin(t*9)*.5;
    if(r.drag.userData.aura)r.drag.userData.aura.rotation.y=t*2.4;
    if(r.drag.userData.genWheel){r.drag.userData.genWheel.rotation.z=t*2.1;r.drag.userData.genOrbs.rotation.y=t*2.8;r.drag.userData.genCore.rotation.y=t*4;r.drag.userData.genCore.rotation.x=t*3}
   }
   const p=proj(r.g.position.x,r.g.position.y+4.1,r.g.position.z);
   if(p&&r.g.position.distanceTo(P.position)<110){
    r.lbl.style.display='block';r.lbl.style.left=p.x+'px';r.lbl.style.top=p.y+'px';
   }else r.lbl.style.display='none';
  });
 };

 function upsertRemote(v){
  if(!v||!v.id||v.id===myId)return;
  let r=remotes.get(v.id);
  if(!r){
   const g=makeChar();g.position.set(v.x||0,v.y||0,v.z||0);scene.add(g);
   const lbl=document.createElement('div');lbl.className='plbl';mbEl.appendChild(lbl);
   r={g,lbl,nick:v.nick||'게스트',rank:v.rank||0,lv:v.lv||1,tx:v.x||0,ty:v.y||0,tz:v.z||0,face:v.face||0,mv:false,riding:false,supGear:false,sword:0,adminGun:'',drag:null,dragKey:'',gearKey:''};
   remotes.set(v.id,r);
  }
  r.nick=v.nick||'게스트';r.rank=v.rank||0;r.lv=v.lv||1;
  r.mv=Math.hypot((v.x||0)-r.tx,(v.z||0)-r.tz)>.04;
  r.tx=v.x||0;r.ty=v.y||0;r.tz=v.z||0;r.face=v.face||0;
  r.riding=!!v.riding;r.supGear=!!v.supGear;r.sword=v.sword||0;r.adminGun=v.adminGun||'';

  const gk=`${v.sword||0}_${v.armor||0}_${v.god?1:0}_${v.supGear?1:0}_${v.adminGun||''}`;
  if(r.gearKey!==gk){r.gearKey=gk;applyGearTo(r.g,v.sword||0,v.armor||0,!!v.god,!!v.supGear,v.adminGun||'')}

  const dk=v.dragEl?`${v.dragR||0}_${v.dragEl}`:'';
  if(r.dragKey!==dk){
   if(r.drag){scene.remove(r.drag);r.drag=null}
   r.dragKey=dk;
   if(v.dragEl&&EL[v.dragEl]){
    const rr=RAR[v.dragEl==='창세의'?6:v.dragEl==='천왕의'?8:v.dragEl==='수호의'?7:v.dragR]||RAR[0];
    r.drag=eliteGlow(makeDragon(EL[v.dragEl],rr.s*(ELT[v.dragEl]?1.3:1),v.dragEl),v.dragEl);
    r.drag.position.set(r.tx+2,r.ty+2,r.tz+2);scene.add(r.drag);
   }
  }
  const rk=v.rank||0;
  const badge=rk===3?'<span style="color:#e879f9">👑[총관리자]</span> ':rk===2?'<span style="color:#fbbf24">👑[상급관리자]</span> ':rk===1?'<span style="color:#38bdf8">🛡[수습관리자]</span> ':'';
  r.lbl.innerHTML=`${badge}${v.nick||'게스트'} <small>Lv.${v.lv||1}</small>`;
 }

 function removeRemote(id){
  const r=remotes.get(id);if(!r)return;
  scene.remove(r.g);if(r.drag)scene.remove(r.drag);r.lbl.remove();remotes.delete(id);
 }

 const mpPanel=$('mpp');
 function renderMpPanel(){
  if(mpPanel.style.display!=='block')return;
  const connected=ws&&ws.readyState===1;
  const myNick=curAcc?curAcc.nick:'게스트';
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;gap:6px">
   <b>🌐 멀티플레이 (${connected?'🟢 연결됨':'🔴 오프라인'} · ${remotes.size+1}명)</b>
   <button id="mpCloseBtn" style="padding:2px 7px;font-size:11px;background:#4b5563">닫기</button>
  </div>
  <div style="margin:6px 0;display:flex;gap:4px">
   <input id="wsUrlInp" value="${getWsUrl()}" placeholder="ws://서버주소:3000" style="flex:1;font-size:11px;padding:4px 6px">
   <button id="wsConnBtn" style="padding:4px 8px;font-size:11px;background:#2563eb">연결</button>
  </div>
  <div style="margin:4px 0;padding:4px 6px;border-radius:6px;background:rgba(128,128,128,.15)">🟢 <b>${myNick}</b> (나 · Lv.${pl.lv})</div>`;
  remotes.forEach((r,id)=>{
   const dist=Math.round(Math.hypot(r.tx-P.position.x,r.tz-P.position.z));
   const badge=r.rank===3?'👑[총관리자] ':r.rank===2?'👑[상급관리자] ':r.rank===1?'🛡[수습관리자] ':'';
   const isSec=r.ty>100&&!isSuperAdmin(curAcc);
   h+=`<div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(128,128,128,.2)">
    <span>${badge}<b>${r.nick}</b> <small>(Lv.${r.lv} · ${r.ty>100?'비밀공간':dist+'m'})</small></span>
    ${isSec?'<span style="font-size:11px;opacity:.6">🔒 비밀</span>':`<button data-tp="${id}" style="padding:3px 8px;font-size:12px">이동</button>`}
   </div>`;
  });
  h+=`<div style="margin-top:6px;display:flex;gap:4px">
   <input id="mpChatInp" maxlength="80" placeholder="전체 채팅 입력..." style="flex:1;font-size:12px;padding:4px 7px">
   <button id="mpChatSend" style="padding:4px 9px;font-size:12px">전송</button>
  </div>`;
  mpPanel.innerHTML=h;
 }

 $('mpStat').onclick=()=>{mpPanel.style.display=mpPanel.style.display==='block'?'none':'block';renderMpPanel()};
 mpPanel.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;b.blur();
  if(b.id==='mpCloseBtn'){mpPanel.style.display='none';return}
  if(b.id==='wsConnBtn'){
   const val=($('wsUrlInp')?.value||'').trim();
   if(val)localStorage.setItem('bdh_ws_url',val);
   connectWs();return;
  }
  if(b.id==='mpChatSend'){
   const inp=$('mpChatInp'),txt=(inp?.value||'').trim();
   if(txt&&ws&&ws.readyState===1){ws.send(JSON.stringify({type:'chat',text:txt}));inp.value=''}
   return;
  }
  if(b.dataset.tp){
   const r=remotes.get(b.dataset.tp);
   if(r){
    if(r.ty>100&&!isSuperAdmin(curAcc))return toast('총관리자 전용 비밀 공간입니다');
    dismount();pl.inSecret=r.ty>100;P.position.set(r.tx+2,r.ty,r.tz+2);mpPanel.style.display='none';
    toast(`✨ ${r.nick}님 곁으로 이동했어요!`);
   }
  }
 });

 window.sendWsGate=function(gate,open){
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'gate',gate,open}));
 };
 window.sendWsNotice=function(text){
  if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'chat',text,notice:true}));
 };

 function connectWs(){
  clearTimeout(reconnectTimer);
  if(ws){try{ws.close()}catch(_){}ws=null}
  const url=getWsUrl();
  try{ws=new WebSocket(url)}catch(_){return}

  ws.onopen=()=>{
   $('mpStat').textContent=`🌐 ${remotes.size+1}명 접속 (목록)`;
   renderMpPanel();
  };

  ws.onmessage=ev=>{
   try{
    const msg=JSON.parse(ev.data);
    if(msg.type==='welcome'){
     myId=msg.id;
     (msg.players||[]).forEach(upsertRemote);
     if(msg.gates)GATES.forEach(g=>{if(typeof msg.gates[g.id]==='boolean')g.open=msg.gates[g.id]});
    }else if(msg.type==='join'){
     upsertRemote(msg.player);
     toast(`👋 ${msg.player?.nick||'모험가'}님이 접속했습니다!`);
    }else if(msg.type==='sync'){
     const alive=new Set();
     (msg.players||[]).forEach(p=>{if(p.id!==myId){alive.add(p.id);upsertRemote(p)}});
     for(const id of remotes.keys()){if(!alive.has(id))removeRemote(id)}
    }else if(msg.type==='leave'){
     removeRemote(msg.id);
     if(msg.nick)toast(`👋 ${msg.nick}님이 퇴장했습니다`);
    }else if(msg.type==='gates'&&msg.gates){
     GATES.forEach(g=>{if(typeof msg.gates[g.id]==='boolean')g.open=msg.gates[g.id]});
    }else if(msg.type==='chat'){
     if(msg.notice)legendBanner('📢 관리자 공지 📢',`${msg.nick}: ${msg.text}`);
     else toast(`💬 [${msg.nick}] ${msg.text}`);
    }
    $('mpStat').textContent=`🌐 ${remotes.size+1}명 접속 (목록)`;
    renderMpPanel();
   }catch(_){}
  };

  ws.onclose=()=>{
   $('mpStat').textContent='🌐 오프라인 (클릭해 연결)';
   renderMpPanel();
   reconnectTimer=setTimeout(connectWs,4000);
  };
 }

 // 초당 15회 내 플레이어 상태 전송
 setInterval(()=>{
  if(!ws||ws.readyState!==1)return;
  const lead=team[0];
  ws.send(JSON.stringify({
   type:'state',
   nick:curAcc?curAcc.nick:'게스트',
   code:curAcc?curAcc.code:'',
   rank:adminRank(curAcc),
   lv:pl.lv,
   x:Math.round(P.position.x*100)/100,
   y:Math.round(P.position.y*100)/100,
   z:Math.round(P.position.z*100)/100,
   face:Math.round(pl.face*100)/100,
   sword:pl.sword,
   armor:pl.armor,
   god:!!pl.god,
   supGear:!!pl.supGear,
   adminGun:pl.adminGun||'',
   riding:!!riding,
   dragR:lead?RAR.indexOf(lead.r):0,
   dragEl:lead?lead.el:''
  }));
 },66);

 connectWs();
})();
