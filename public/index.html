
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D 낚시 게임 - 로그인</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; }

    /* 로그인/회원가입 모달 */
    #authOverlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(13, 27, 42, 0.92); display: flex;
      justify-content: center; align-items: center; z-index: 100;
    }
    .auth-box {
      background: linear-gradient(145deg, #1a2a3a, #0d1b2a);
      padding: 30px; border-radius: 16px; width: 320px;
      color: white; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      border: 2px solid #2196f3; text-align: center;
    }
    .auth-box h2 { margin-bottom: 20px; color: #64b5f6; }
    .auth-input {
      width: 100%; padding: 12px; margin-bottom: 12px;
      border: 1px solid #37474f; border-radius: 8px;
      background: #102027; color: white; font-size: 14px; outline: none;
    }
    .auth-input:focus { border-color: #2196f3; }
    .auth-btn-group { display: flex; gap: 8px; margin-top: 10px; }
    .auth-btn {
      flex: 1; padding: 12px; border: none; border-radius: 8px;
      font-weight: bold; cursor: pointer; transition: 0.2s;
    }
    .login-btn { background: #2196f3; color: white; }
    .register-btn { background: #4caf50; color: white; }
    #authMsg { margin-top: 14px; font-size: 13px; color: #ff5252; min-height: 18px; }

    /* 게임 UI */
    #ui {
      position: absolute; top: 12px; left: 12px;
      color: white; text-shadow: 0 2px 4px rgba(0,0,0,0.7);
      z-index: 10; pointer-events: none; display: none;
    }
    #ui h1 { font-size: 18px; margin-bottom: 4px; }
    #ui p { font-size: 13px; opacity: 0.9; line-height: 1.4; }
    #moneyDisplay {
      position: absolute; top: 12px; right: 14px;
      color: #ffd700; font-size: 18px; font-weight: bold;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8); z-index: 10; display: none;
    }
    #status {
      position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%);
      color: #fff; font-size: 17px; font-weight: bold;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8); z-index: 10;
      text-align: center; width: 92%; pointer-events: none; display: none;
    }
    #tension-bar {
      position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%);
      width: 260px; height: 13px; background: rgba(0,0,0,0.5);
      border-radius: 7px; overflow: hidden; display: none; z-index: 10;
      border: 2px solid rgba(255,255,255,0.3);
    }
    #tension-fill {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, #4caf50, #ffeb3b, #f44336);
    }
    #controls {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      display: none; gap: 8px; z-index: 15; flex-wrap: wrap; justify-content: center;
    }
    button {
      padding: 10px 16px; font-size: 13px; font-weight: bold;
      border: none; border-radius: 10px; cursor: pointer;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3); min-width: 90px;
      user-select: none; -webkit-user-select: none; transition: 0.15s;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,0.3); }
    button:disabled { background: #555 !important; color: #999 !important; box-shadow: none; cursor: not-allowed; }

    #castBtn { background: linear-gradient(to bottom, #4CAF50, #388E3C); color: white; }
    #reelBtn { background: linear-gradient(to bottom, #2196F3, #1976D2); color: white; }
    #reelBtn.holding { background: linear-gradient(to bottom, #FF9800, #F57C00); }
    #invBtn { background: linear-gradient(to bottom, #00BCD4, #0097A7); color: white; }
    #shopBtn { background: linear-gradient(to bottom, #FF9800, #F57C00); color: white; }
    #customBtn { background: linear-gradient(to bottom, #9C27B0, #7B1FA2); color: white; }
  </style>
</head>
<body>

  <!-- 인증 (로그인/회원가입) 레이어 -->
  <div id="authOverlay">
    <div class="auth-box">
      <h2>🎣 낚시 게임 접속</h2>
      <input type="text" id="username" class="auth-input" placeholder="아이디" autocomplete="off">
      <input type="password" id="password" class="auth-input" placeholder="비밀번호">
      <div class="auth-btn-group">
        <button id="loginBtn" class="auth-btn login-btn">로그인</button>
        <button id="registerBtn" class="auth-btn register-btn">회원가입</button>
      </div>
      <div id="authMsg"></div>
    </div>
  </div>

  <div id="ui">
    <h1 id="userGreeting">🎣 3D 낚시 게임</h1>
    <p>WASD 이동 · 드래그 시점<br>캐스팅 / 릴 / 인벤 / 상점</p>
  </div>
  <div id="moneyDisplay">💰 0 G</div>
  <div id="status">상점에서 낚싯대를 구매할 수 있습니다</div>
  <div id="tension-bar"><div id="tension-fill"></div></div>

  <div id="controls">
    <button id="castBtn">🎣 캐스팅</button>
    <button id="reelBtn" disabled>🔄 릴</button>
    <button id="invBtn">🎒 인벤</button>
    <button id="shopBtn">🏪 상점</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket = null;
    let currentUser = null;

    const authOverlay = document.getElementById("authOverlay");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const authMsg = document.getElementById("authMsg");

    // 회원가입
    document.getElementById("registerBtn").onclick = async () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      if (!username || !password) return showMsg("아이디와 비밀번호를 입력해 주세요.");

      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      showMsg(data.message, data.success);
    };

    // 로그인
    document.getElementById("loginBtn").onclick = async () => {
      const username = usernameInput.value.trim();
      const password = passwordInput.value.trim();
      if (!username || !password) return showMsg("아이디와 비밀번호를 입력해 주세요.");

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (data.success) {
        currentUser = data.user;
        startGame();
      } else {
        showMsg(data.message);
      }
    };

    function showMsg(msg, isSuccess = false) {
      authMsg.textContent = msg;
      authMsg.style.color = isSuccess ? "#4caf50" : "#ff5252";
    }

    function startGame() {
      authOverlay.style.display = "none";
      document.getElementById("ui").style.display = "block";
      document.getElementById("moneyDisplay").style.display = "block";
      document.getElementById("status").style.display = "block";
      document.getElementById("controls").style.display = "flex";
      document.getElementById("userGreeting").textContent = `🎣 ${currentUser.username}님의 3D 낚시`;

      socket = io();
      socket.emit('joinGame', { gold: currentUser.gold });
      init3DGame();
    }

    // Three.js 3D 낚시 게임 로직
    function init3DGame() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87CEEB);
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const sun = new THREE.DirectionalLight(0xffffff, 0.8);
      sun.position.set(30, 50, 20);
      scene.add(sun);

      const water = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), new THREE.MeshStandardMaterial({ color: 0x1a6b9a }));
      water.rotation.x = -Math.PI/2;
      scene.add(water);

      const player = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.2), new THREE.MeshStandardMaterial({ color: 0x2196f3 }));
      player.position.set(0, 0.6, 4);
      scene.add(player);

      camera.position.set(0, 3, 9);
      camera.lookAt(player.position);
